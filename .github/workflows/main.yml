name: TrawkaClient Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  android:
    name: Build TrawkaLauncher V4
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz TrawkaClient
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Pobierz pełnego Amethysta
        run: |
          git clone --recursive https://github.com/AngelAuraMC/Amethyst-Android.git amethyst

      - name: Przygotuj Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Przygotuj listę języków
        working-directory: amethyst
        run: |
          chmod +x scripts/languagelist_updater.sh
          bash scripts/languagelist_updater.sh

      - name: TrawkaClient
        working-directory: amethyst
        run: |
          sed -i 's/<string name="app_name">[^<]*/<string name="app_name">TrawkaLauncher/' \
          app_pojavlauncher/src/main/res/values/strings.xml

      - name: Zbuduj prawdziwy launcher Minecraft
        working-directory: amethyst
        run: |
          chmod +x gradlew
          ./gradlew :app_pojavlauncher:assembleDebug

      - name: Zmień nazwę APK
        working-directory: amethyst
        run: |
          APK=$(find app_pojavlauncher/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "Nie znaleziono APK!"
            exit 1
          fi
          cp "$APK" app_pojavlauncher/build/outputs/apk/debug/TrawkaLauncher-V4.apk

      - name: Udostępnij APK
        uses: actions/upload-artifact@v4
        with:
          name: TrawkaLauncher-V4
          path: amethyst/app_pojavlauncher/build/outputs/apk/debug/TrawkaLauncher-V4.apk
