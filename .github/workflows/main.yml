name: Build TrawkaLauncher V4

on:
  workflow_dispatch:

jobs:
  android:
    name: Build TrawkaLauncher Android
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz TrawkaClient
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Pobierz Amethyst
        run: |
          git clone --recursive https://github.com/AngelAuraMC/Amethyst-Android.git amethyst

      - name: Przygotuj Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Buduj prawdziwy launcher Minecraft
        run: |
          chmod +x gradlew
          ./gradlew :app_pojavlauncher:assembleDebug
        working-directory: amethyst

      - name: Udostępnij APK
        uses: actions/upload-artifact@v4
        with:
          name: TrawkaLauncher-Android
          path: amethyst/app_pojavlauncher/build/outputs/apk/debug/*.apk
